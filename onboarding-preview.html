<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PosePrompter - Onboarding Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #050508;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }

  .modal {
    background: linear-gradient(160deg, #08080f 0%, #0c0c16 50%, #0a0a12 100%);
    border-radius: 24px;
    max-width: 920px;
    width: 100%;
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
    max-height: 94vh;
    overflow-y: auto;
    animation: modalIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 0 80px rgba(0,0,0,0.6), 0 0 200px rgba(120, 80, 200, 0.03);
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .skip-btn {
    position: absolute;
    top: 16px;
    right: 18px;
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.2);
    font-size: 13px;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 8px;
    transition: all 0.3s;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: inherit;
    letter-spacing: 0.3px;
  }
  .skip-btn:hover { color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.04); }

  .layout {
    display: flex;
    flex-direction: row;
    min-height: 520px;
  }

  .left-panel {
    flex: 0 0 46%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    border-right: 1px solid rgba(255,255,255,0.03);
  }

  .ambient-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transition: opacity 1.5s, background 1.5s;
    opacity: 0;
  }

  canvas {
    width: 100%;
    max-width: 420px;
    height: auto;
    aspect-ratio: 400/400;
  }

  .prompt-preview {
    width: 100%;
    max-width: 360px;
    margin-top: 4px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 12px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(10px);
  }
  .prompt-preview.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .prompt-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .prompt-label span {
    font-size: 9.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .copy-btn {
    padding: 3px 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 6px;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    font-size: 10px;
    font-weight: 600;
    transition: all 0.25s;
    font-family: inherit;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
  .copy-btn.copied {
    background: rgba(34, 197, 94, 0.12);
    border-color: rgba(34,197,94,0.25);
    color: #22c55e;
  }

  .prompt-text {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    line-height: 1.7;
    font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
    max-height: 72px;
    overflow-y: auto;
  }

  .right-panel {
    flex: 1;
    padding: clamp(28px, 4vw, 44px);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .right-panel h2 {
    font-size: clamp(22px, 4vw, 28px);
    font-weight: 300;
    color: rgba(255,255,255,0.9);
    margin-bottom: 6px;
    letter-spacing: -0.5px;
    line-height: 1.2;
    animation: fadeSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
  }
  .right-panel h2 em {
    font-style: normal;
    font-weight: 600;
    background: linear-gradient(135deg, #c4b5fd, #a78bfa, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .right-panel > p {
    font-size: clamp(13px, 2.5vw, 14px);
    color: rgba(255,255,255,0.3);
    margin-bottom: 30px;
    line-height: 1.5;
    font-weight: 400;
    animation: fadeSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .category-group {
    margin-bottom: 20px;
    opacity: 0;
    animation: catIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .category-group:nth-child(1) { animation-delay: 0.22s; }
  .category-group:nth-child(2) { animation-delay: 0.32s; }
  .category-group:nth-child(3) { animation-delay: 0.42s; }
  .category-group:nth-child(4) { animation-delay: 0.52s; }

  @keyframes catIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .category-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 9px;
  }
  .category-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .category-dot.active {
    box-shadow: 0 0 10px var(--cat-color), 0 0 20px var(--cat-color);
    transform: scale(1.3);
  }
  .category-name {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    transition: color 0.4s;
  }

  .option-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .option-btn {
    padding: 9px 18px;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .option-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, var(--btn-glow, transparent) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .option-btn:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.12);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .option-btn:hover::before { opacity: 1; }
  .option-btn:active { transform: scale(0.96) translateY(0); }
  .option-btn.selected {
    font-weight: 600;
    border-color: transparent;
    box-shadow: 0 0 20px var(--btn-shadow, transparent);
  }

  .bottom-section {
    margin-top: 28px;
    animation: fadeSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 16px;
  }
  .progress-bar {
    flex: 1;
    height: 2px;
    border-radius: 1px;
    background: rgba(255,255,255,0.06);
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }
  .progress-bar.filled {
    box-shadow: 0 0 8px var(--bar-color);
    height: 2.5px;
  }
  .progress-count {
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    margin-left: 8px;
    white-space: nowrap;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .info-text {
    font-size: 12.5px;
    color: rgba(255,255,255,0.25);
    line-height: 1.6;
    margin-bottom: 18px;
    font-weight: 400;
  }

  .cta-btn {
    width: 100%;
    padding: 15px 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    color: rgba(255,255,255,0.35);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.2px;
  }
  .cta-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #a855f7, #6366f1, #3b82f6);
    opacity: 0;
    transition: opacity 0.5s;
  }
  .cta-btn:hover {
    transform: translateY(-1px);
    border-color: rgba(255,255,255,0.1);
  }
  .cta-btn.active {
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 30px rgba(120, 80, 200, 0.2), 0 0 60px rgba(120, 80, 200, 0.1);
    font-weight: 600;
  }
  .cta-btn.active::before {
    opacity: 1;
    animation: shimmer 4s ease-in-out infinite;
  }
  .cta-btn.active span,
  .cta-btn.active svg { position: relative; z-index: 1; }

  @keyframes shimmer {
    0%, 100% { filter: hue-rotate(0deg) brightness(1); }
    33% { filter: hue-rotate(15deg) brightness(1.1); }
    66% { filter: hue-rotate(-15deg) brightness(1.05); }
  }

  @media (max-width: 700px) {
    .layout { flex-direction: column; min-height: auto; }
    .left-panel {
      border-right: none;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      padding: 24px 16px 16px;
      flex: none;
    }
    .modal { border-radius: 18px; }
  }
</style>
</head>
<body>

<div class="modal">
  <button class="skip-btn" onclick="handleComplete()">
    skip
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </button>

  <div class="layout">
    <div class="left-panel">
      <div class="ambient-glow" id="ambientGlow"></div>
      <canvas id="figureCanvas" width="800" height="800"></canvas>
      <div class="prompt-preview" id="promptPreview">
        <div class="prompt-label">
          <span>Generated prompt</span>
          <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
        </div>
        <div class="prompt-text" id="promptText"></div>
      </div>
    </div>

    <div class="right-panel">
      <h2>Compose your <em>vision</em></h2>
      <p>Select from each category. Watch the prompt write itself.</p>
      <div id="categories"></div>
      <div class="bottom-section">
        <div class="progress-row" id="progressRow"></div>
        <div class="info-text" id="infoText">Each category adds a layer to the final prompt.</div>
        <button class="cta-btn" id="ctaBtn" onclick="handleComplete()">
          <span>Skip to the studio</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// ─── Data ───────────────────────────────────────────────────────────────────

const POSES = {
  default: {
    head:{x:200,y:52}, neck:{x:200,y:78},
    sL:{x:170,y:86}, sR:{x:230,y:86},
    torso:{x:200,y:152}, hL:{x:183,y:178}, hR:{x:217,y:178},
    eL:{x:148,y:140}, eR:{x:252,y:140},
    wL:{x:140,y:194}, wR:{x:260,y:194},
    kL:{x:188,y:254}, kR:{x:212,y:254},
    fL:{x:185,y:332}, fR:{x:215,y:332},
  },
  confident: {
    head:{x:200,y:48}, neck:{x:200,y:74},
    sL:{x:163,y:83}, sR:{x:237,y:83},
    torso:{x:200,y:150}, hL:{x:180,y:176}, hR:{x:220,y:176},
    eL:{x:138,y:136}, eR:{x:262,y:136},
    wL:{x:132,y:190}, wR:{x:268,y:190},
    kL:{x:176,y:252}, kR:{x:224,y:252},
    fL:{x:168,y:332}, fR:{x:232,y:332},
  },
  relaxed: {
    head:{x:194,y:54}, neck:{x:196,y:80},
    sL:{x:167,y:90}, sR:{x:228,y:85},
    torso:{x:197,y:154}, hL:{x:184,y:180}, hR:{x:214,y:177},
    eL:{x:144,y:150}, eR:{x:256,y:132},
    wL:{x:136,y:204}, wR:{x:264,y:174},
    kL:{x:186,y:258}, kR:{x:216,y:250},
    fL:{x:180,y:332}, fR:{x:228,y:332},
  },
  dramatic: {
    head:{x:191,y:50}, neck:{x:194,y:76},
    sL:{x:162,y:85}, sR:{x:234,y:81},
    torso:{x:202,y:152}, hL:{x:188,y:178}, hR:{x:220,y:174},
    eL:{x:132,y:126}, eR:{x:268,y:116},
    wL:{x:110,y:158}, wR:{x:290,y:94},
    kL:{x:190,y:256}, kR:{x:228,y:246},
    fL:{x:184,y:332}, fR:{x:240,y:332},
  },
};

const CATEGORIES = [
  {
    key: 'pose', label: 'Pose', color: '#10b981',
    options: [
      { id:'confident', label:'Confident', pose:'confident', prompt:'shoulders back, commanding presence, power stance, one foot forward' },
      { id:'relaxed', label:'Relaxed', pose:'relaxed', prompt:'leaning, one leg bent, hip shifted, elegant S-curve' },
      { id:'dramatic', label:'Dramatic', pose:'dramatic', prompt:'back half-turned, looking over shoulder, one hand raised, dynamic tension' },
    ]
  },
  {
    key: 'lighting', label: 'Lighting', color: '#f59e0b',
    options: [
      { id:'golden', label:'Golden Hour', lighting:'golden', prompt:'warm golden hour light, soft glow, elongated shadows, romantic radiance' },
      { id:'dramatic', label:'Hard Light', lighting:'dramatic', prompt:'dramatic hard light, high-contrast, sharp shadows, theatrical' },
      { id:'soft', label:'Soft Diffused', lighting:'soft', prompt:'soft diffused window light, gentle glow, minimal shadows, dreamlike' },
    ]
  },
  {
    key: 'aesthetic', label: 'Aesthetic', color: '#a855f7',
    options: [
      { id:'timeless', label:'Timeless', prompt:'sophisticated timeless elegance, classic Hollywood, serene luxury' },
      { id:'indie', label:'Indie Film', prompt:'raw indie warmth, candid feel, analog grain, authentic moment' },
      { id:'ethereal', label:'Ethereal', prompt:'ethereal softness, dreamy pastels, gentle otherworldly glow' },
    ]
  },
  {
    key: 'background', label: 'Background', color: '#06b6d4',
    options: [
      { id:'garden', label:'Garden', prompt:'lush garden, cascading wisteria, stone terraces, topiary' },
      { id:'coastal', label:'Coastal', prompt:'private beach, weathered fence, sand dunes, mist over water' },
      { id:'studio', label:'Studio', prompt:'minimalist interior, high ceilings, large windows, polished floors' },
    ]
  },
];

// ─── State ──────────────────────────────────────────────────────────────────

let selections = {};
let currentPose = JSON.parse(JSON.stringify(POSES.default));
let targetPose = POSES.default;
let morphProgress = 1;
let breath = 0;
let lightingStyle = null;
let aestheticStyle = null;
let backgroundStyle = null;

// Color system (HSL-based, smoothly interpolated)
let figHue = 225, figSat = 15, figLight = 78, figAlpha = 0.35;
let tgtHue = 225, tgtSat = 15, tgtLight = 78, tgtAlpha = 0.35;
let glowHue = 225, glowSat = 30, glowAlpha = 0.25;
let tgtGlowHue = 225, tgtGlowSat = 30, tgtGlowAlpha = 0.25;

// Particle system
const NUM_PARTICLES = 50;
const particles = [];

function initParticles() {
  for (let i = 0; i < NUM_PARTICLES; i++) {
    particles.push({
      x: 60 + Math.random() * 280,
      y: 30 + Math.random() * 340,
      vx: (Math.random() - 0.5) * 0.15,
      vy: -0.05 - Math.random() * 0.1,
      size: 0.4 + Math.random() * 2.2,
      alpha: 0.03 + Math.random() * 0.1,
      phase: Math.random() * Math.PI * 2,
      drift: 0.3 + Math.random() * 0.7,
    });
  }
}
initParticles();

// Burst particles (spawn on selection)
let burstParticles = [];

// ─── Canvas Setup ───────────────────────────────────────────────────────────

const canvas = document.getElementById('figureCanvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
canvas.width = 400 * dpr;
canvas.height = 400 * dpr;
ctx.scale(dpr, dpr);

function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

function lerpPose(current, target, t) {
  const result = {};
  for (const key in target) {
    result[key] = {};
    for (const sub in target[key]) {
      result[key][sub] = lerp(current[key]?.[sub] ?? target[key][sub], target[key][sub], t);
    }
  }
  return result;
}

// ─── Drawing Helpers ────────────────────────────────────────────────────────

function drawFilledLimb(start, end, startW, endW) {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const nx = -dy / len;
  const ny = dx / len;

  const midX = (start.x + end.x) / 2;
  const midY = (start.y + end.y) / 2;
  const avgW = (startW + endW) / 2;

  ctx.beginPath();
  // Outer edge
  ctx.moveTo(start.x + nx * startW/2, start.y + ny * startW/2);
  ctx.quadraticCurveTo(
    midX + nx * avgW * 0.55,
    midY + ny * avgW * 0.55,
    end.x + nx * endW/2,
    end.y + ny * endW/2
  );
  // Rounded tip
  ctx.quadraticCurveTo(
    end.x + nx * endW * 0.1, end.y + ny * endW * 0.1 + 1,
    end.x - nx * endW/2, end.y - ny * endW/2
  );
  // Inner edge
  ctx.quadraticCurveTo(
    midX - nx * avgW * 0.45,
    midY - ny * avgW * 0.45,
    start.x - nx * startW/2,
    start.y - ny * startW/2
  );
  ctx.closePath();
  ctx.fill();
}

function drawTorso(p) {
  ctx.beginPath();
  ctx.moveTo(p.sL.x, p.sL.y);
  // Up to neck
  ctx.quadraticCurveTo(p.head.x - 6, p.sL.y - 6, p.head.x - 6, p.head.y + 18);
  ctx.lineTo(p.head.x + 6, p.head.y + 18);
  ctx.quadraticCurveTo(p.head.x + 6, p.sR.y - 6, p.sR.x, p.sR.y);
  // Right side: shoulder → waist → hip
  ctx.bezierCurveTo(
    p.sR.x + 3, p.sR.y + 22,
    p.torso.x + 15, p.torso.y - 12,
    p.torso.x + 12, p.torso.y
  );
  ctx.bezierCurveTo(
    p.torso.x + 14, p.torso.y + 10,
    p.hR.x + 6, p.hR.y - 6,
    p.hR.x, p.hR.y
  );
  // Across hips (slight curve downward for pelvic shape)
  ctx.quadraticCurveTo(
    (p.hL.x + p.hR.x) / 2, Math.max(p.hL.y, p.hR.y) + 6,
    p.hL.x, p.hL.y
  );
  // Left side: hip → waist → shoulder
  ctx.bezierCurveTo(
    p.hL.x - 6, p.hL.y - 6,
    p.torso.x - 14, p.torso.y + 10,
    p.torso.x - 12, p.torso.y
  );
  ctx.bezierCurveTo(
    p.torso.x - 15, p.torso.y - 12,
    p.sL.x - 3, p.sL.y + 22,
    p.sL.x, p.sL.y
  );
  ctx.closePath();
  ctx.fill();
}

function drawHair(p) {
  const hx = p.head.x;
  const hy = p.head.y;
  const hr = 16;
  const headDir = (hx - 200) * 0.12;

  // Hair volume cap
  ctx.beginPath();
  ctx.ellipse(hx, hy - 4, 16, 20, 0, -Math.PI * 0.95, -Math.PI * 0.05);
  ctx.fill();

  // Flowing strands (3 per side, using stroke for elegance)
  ctx.save();
  ctx.lineCap = 'round';

  const strandConfigs = [
    // Left strands
    { side: -1, startAngle: -0.78, len: 65, width: 3.5, alphaBase: 0.5, offset: 0 },
    { side: -1, startAngle: -0.65, len: 55, width: 2.5, alphaBase: 0.35, offset: 1.2 },
    { side: -1, startAngle: -0.88, len: 48, width: 2, alphaBase: 0.25, offset: 2.5 },
    // Right strands
    { side: 1, startAngle: -0.22, len: 62, width: 3.5, alphaBase: 0.5, offset: 0.5 },
    { side: 1, startAngle: -0.35, len: 52, width: 2.5, alphaBase: 0.35, offset: 1.8 },
    { side: 1, startAngle: -0.12, len: 45, width: 2, alphaBase: 0.25, offset: 3 },
  ];

  strandConfigs.forEach(s => {
    const angle = Math.PI * s.startAngle;
    const sx = hx + Math.cos(angle) * (hr + 2);
    const sy = hy + Math.sin(angle) * (hr + 2);
    const sway = Math.sin(breath * 0.35 + s.offset) * 3;
    const sway2 = Math.sin(breath * 0.25 + s.offset + 1) * 4;

    ctx.globalAlpha = s.alphaBase;
    ctx.lineWidth = s.width;
    ctx.strokeStyle = ctx.fillStyle;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.bezierCurveTo(
      sx + s.side * 8 + headDir + sway, sy + s.len * 0.35,
      sx + s.side * 4 + headDir + sway2, sy + s.len * 0.65,
      sx + s.side * 6 + headDir + sway + sway2 * 0.5, sy + s.len
    );
    ctx.stroke();
  });

  ctx.restore();
}

function drawHeel(ankle, side) {
  const dir = side;
  // Pointed-toe shoe body
  ctx.beginPath();
  ctx.moveTo(ankle.x - dir * 3, ankle.y - 3);
  ctx.quadraticCurveTo(ankle.x + dir * 8, ankle.y - 6, ankle.x + dir * 18, ankle.y - 2);
  ctx.quadraticCurveTo(ankle.x + dir * 12, ankle.y + 2, ankle.x - dir * 2, ankle.y + 1);
  ctx.closePath();
  ctx.fill();
  // Stiletto heel
  ctx.beginPath();
  ctx.moveTo(ankle.x - dir * 1, ankle.y);
  ctx.lineTo(ankle.x - dir * 5, ankle.y + 13);
  ctx.lineTo(ankle.x - dir * 7, ankle.y + 14);
  ctx.lineTo(ankle.x - dir * 3, ankle.y + 14);
  ctx.lineTo(ankle.x - dir * 0, ankle.y + 1);
  ctx.closePath();
  ctx.fill();
}

function drawDressSkirt(p) {
  const hemY = Math.max(p.kL.y, p.kR.y) + 18;
  const flare = 24;
  const flutter = Math.sin(breath * 0.5) * 3;
  const flutter2 = Math.sin(breath * 0.4 + 1.2) * 2;
  const midX = (p.hL.x + p.hR.x) / 2;

  ctx.beginPath();
  ctx.moveTo(p.hL.x - 4, p.hL.y - 3);
  // Left side: hip to hem (flaring out)
  ctx.bezierCurveTo(
    p.hL.x - 10, (p.hL.y + hemY) / 2,
    p.kL.x - flare + flutter, hemY - 14,
    p.kL.x - flare + flutter, hemY
  );
  // Hem with flowing curve
  ctx.quadraticCurveTo(midX - 12, hemY + 6 + flutter2, midX, hemY + 5 + flutter2);
  ctx.quadraticCurveTo(midX + 12, hemY + 6 + flutter2, p.kR.x + flare - flutter, hemY);
  // Right side: hem to hip
  ctx.bezierCurveTo(
    p.kR.x + flare - flutter, hemY - 14,
    p.hR.x + 10, (p.hR.y + hemY) / 2,
    p.hR.x + 4, p.hR.y - 3
  );
  ctx.closePath();
  ctx.fill();

  // Dress details
  ctx.save();
  // Waist belt
  ctx.globalAlpha = 0.14;
  ctx.strokeStyle = `hsla(${figHue}, ${figSat + 10}%, ${figLight + 15}%, 1)`;
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(p.torso.x - 13, p.torso.y + 1);
  ctx.quadraticCurveTo(p.torso.x, p.torso.y + 3, p.torso.x + 13, p.torso.y + 1);
  ctx.stroke();
  // Small belt buckle
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = `hsla(${figHue}, ${figSat + 10}%, ${figLight + 15}%, 1)`;
  ctx.fillRect(p.torso.x - 2, p.torso.y - 1, 4, 4);

  // Subtle fold lines in skirt
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = `hsla(${figHue}, ${figSat}%, ${figLight + 10}%, 1)`;
  ctx.lineWidth = 0.8;
  const foldTop = p.hL.y + 8;
  const foldBot = hemY - 6;
  ctx.beginPath();
  ctx.moveTo(midX - 8, foldTop);
  ctx.quadraticCurveTo(midX - 12, (foldTop + foldBot) / 2, midX - 14 + flutter * 0.3, foldBot);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(midX + 6, foldTop);
  ctx.quadraticCurveTo(midX + 10, (foldTop + foldBot) / 2, midX + 12 - flutter * 0.3, foldBot);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(midX - 1, foldTop - 3);
  ctx.quadraticCurveTo(midX, (foldTop + foldBot) / 2, midX + 1, foldBot);
  ctx.stroke();
  ctx.restore();
}

function drawNeckline(p) {
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = `hsla(${figHue}, ${figSat + 10}%, ${figLight + 15}%, 1)`;
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';
  const neckY = (p.sL.y + p.sR.y) / 2;
  // V-neckline
  ctx.beginPath();
  ctx.moveTo(p.sL.x + 7, neckY + 2);
  ctx.lineTo(p.head.x, neckY + 16);
  ctx.lineTo(p.sR.x - 7, neckY + 2);
  ctx.stroke();
  ctx.restore();
}

function drawGlasses(p) {
  ctx.save();
  const hx = p.head.x;
  const hy = p.head.y;
  // Oversized sunglasses
  const glassAlpha = figAlpha + 0.15;
  ctx.strokeStyle = `hsla(${figHue}, ${figSat + 10}%, ${figLight - 15}%, ${glassAlpha})`;
  ctx.fillStyle = `hsla(${figHue}, ${figSat + 15}%, ${figLight - 5}%, ${figAlpha * 0.25})`;
  ctx.lineWidth = 1.4;
  // Left lens (cat-eye shape)
  ctx.beginPath();
  ctx.moveTo(hx - 2, hy - 3);
  ctx.bezierCurveTo(hx - 3, hy - 6, hx - 9, hy - 7, hx - 12, hy - 5);
  ctx.bezierCurveTo(hx - 14, hy - 3, hx - 13, hy + 2, hx - 10, hy + 3);
  ctx.bezierCurveTo(hx - 7, hy + 4, hx - 3, hy + 1, hx - 2, hy - 1);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Right lens (cat-eye shape, mirrored)
  ctx.beginPath();
  ctx.moveTo(hx + 2, hy - 3);
  ctx.bezierCurveTo(hx + 3, hy - 6, hx + 9, hy - 7, hx + 12, hy - 5);
  ctx.bezierCurveTo(hx + 14, hy - 3, hx + 13, hy + 2, hx + 10, hy + 3);
  ctx.bezierCurveTo(hx + 7, hy + 4, hx + 3, hy + 1, hx + 2, hy - 1);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Bridge
  ctx.beginPath();
  ctx.lineWidth = 1.2;
  ctx.moveTo(hx - 2, hy - 2.5);
  ctx.quadraticCurveTo(hx, hy - 4, hx + 2, hy - 2.5);
  ctx.stroke();
  // Temple arms
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.moveTo(hx - 12.5, hy - 4.5);
  ctx.lineTo(hx - 14, hy - 3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(hx + 12.5, hy - 4.5);
  ctx.lineTo(hx + 14, hy - 3);
  ctx.stroke();
  ctx.restore();
}

function drawScarf(p) {
  ctx.save();
  const sway1 = Math.sin(breath * 0.35) * 5;
  const sway2 = Math.sin(breath * 0.28 + 0.8) * 4;
  const sway3 = Math.sin(breath * 0.4 + 1.5) * 3;

  // Scarf with a complementary hue offset
  const scarfFill = `hsla(${figHue + 30}, ${figSat + 18}%, ${figLight + 2}%, ${figAlpha * 0.75})`;
  ctx.fillStyle = scarfFill;
  ctx.shadowBlur = 10;
  ctx.shadowColor = `hsla(${figHue + 30}, ${figSat + 18}%, 60%, ${glowAlpha * 0.4})`;

  // Neck wrap band
  const neckY = (p.sL.y + p.sR.y) / 2 - 2;
  ctx.beginPath();
  ctx.moveTo(p.sL.x + 8, neckY - 3);
  ctx.quadraticCurveTo(p.head.x, neckY + 6, p.sR.x - 6, neckY - 2);
  ctx.quadraticCurveTo(p.head.x, neckY + 11, p.sL.x + 8, neckY + 3);
  ctx.closePath();
  ctx.fill();

  // Flowing ribbon end
  const sx = p.sR.x - 8;
  const sy = neckY;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.bezierCurveTo(sx + 10 + sway1, sy + 28, sx + 3 + sway2, sy + 58, sx + 8 + sway1 + sway3, sy + 88);
  ctx.lineTo(sx + 5 + sway1 + sway3, sy + 92);
  ctx.bezierCurveTo(sx - 1 + sway2, sy + 60, sx + 5 + sway1, sy + 30, sx - 4, sy + 4);
  ctx.closePath();
  ctx.fill();

  // Second shorter ribbon end
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.moveTo(sx - 2, sy + 2);
  ctx.bezierCurveTo(sx + 5 + sway1 * 0.6, sy + 20, sx - 1 + sway2 * 0.7, sy + 42, sx + 3 + sway3, sy + 60);
  ctx.lineTo(sx + 1 + sway3, sy + 63);
  ctx.bezierCurveTo(sx - 4 + sway2 * 0.5, sy + 42, sx + 1 + sway1 * 0.4, sy + 22, sx - 5, sy + 5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// ─── Environment Drawing ────────────────────────────────────────────────────

function drawEnvironment() {
  if (backgroundStyle === 'garden') {
    ctx.save();
    // Soft foliage washes
    const g1 = ctx.createRadialGradient(60, 200, 10, 60, 200, 120);
    g1.addColorStop(0, 'rgba(34, 197, 94, 0.06)');
    g1.addColorStop(1, 'transparent');
    ctx.fillStyle = g1; ctx.fillRect(0, 0, 400, 400);

    const g2 = ctx.createRadialGradient(340, 180, 10, 340, 180, 100);
    g2.addColorStop(0, 'rgba(34, 197, 94, 0.04)');
    g2.addColorStop(1, 'transparent');
    ctx.fillStyle = g2; ctx.fillRect(0, 0, 400, 400);

    // Vine silhouettes
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';

    // Left vine
    ctx.beginPath();
    ctx.moveTo(25, 400);
    ctx.bezierCurveTo(35, 300, 45, 220, 55, 150);
    ctx.bezierCurveTo(50, 100, 60, 60, 65, 20);
    ctx.stroke();

    // Leaves
    [[48, 180, -0.4], [58, 130, -0.6], [42, 240, -0.3]].forEach(([lx, ly, rot]) => {
      ctx.beginPath();
      ctx.ellipse(lx, ly, 14, 5, rot + Math.sin(breath * 0.4) * 0.08, 0, Math.PI * 2);
      ctx.stroke();
    });

    // Right vine
    ctx.beginPath();
    ctx.moveTo(375, 400);
    ctx.bezierCurveTo(365, 280, 350, 200, 345, 130);
    ctx.bezierCurveTo(350, 80, 340, 40, 335, 0);
    ctx.stroke();

    [[352, 190, 0.4], [342, 140, 0.5], [358, 260, 0.3]].forEach(([lx, ly, rot]) => {
      ctx.beginPath();
      ctx.ellipse(lx, ly, 14, 5, rot - Math.sin(breath * 0.4) * 0.08, 0, Math.PI * 2);
      ctx.stroke();
    });

    // Wisteria cascades
    ctx.globalAlpha = 0.045;
    ctx.strokeStyle = '#a855f7';
    for (let i = 0; i < 6; i++) {
      const wx = 50 + i * 62;
      ctx.beginPath();
      ctx.moveTo(wx, 0);
      ctx.bezierCurveTo(
        wx + 8, 20 + Math.sin(breath + i) * 2,
        wx - 4, 40 + Math.sin(breath * 0.7 + i) * 3,
        wx + 4, 55 + Math.sin(breath * 0.5 + i) * 4
      );
      ctx.stroke();
    }
    ctx.restore();

  } else if (backgroundStyle === 'coastal') {
    ctx.save();
    // Sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, 140);
    sky.addColorStop(0, 'rgba(6, 100, 150, 0.04)');
    sky.addColorStop(1, 'transparent');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 400, 140);

    // Horizon
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = '#06b6d4';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, 125);
    ctx.lineTo(400, 123);
    ctx.stroke();

    // Waves
    ctx.globalAlpha = 0.04;
    ctx.lineWidth = 0.8;
    for (let w = 0; w < 5; w++) {
      ctx.beginPath();
      const wy = 140 + w * 22;
      for (let x = 0; x <= 400; x += 4) {
        const y = wy + Math.sin(x * 0.025 + breath * 0.6 + w * 1.8) * (2.5 + w * 0.8);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // Sand gradient
    const sand = ctx.createLinearGradient(0, 330, 0, 400);
    sand.addColorStop(0, 'transparent');
    sand.addColorStop(1, 'rgba(245, 158, 11, 0.03)');
    ctx.fillStyle = sand; ctx.fillRect(0, 330, 400, 70);

    // Atmospheric haze
    const haze = ctx.createLinearGradient(0, 110, 0, 170);
    haze.addColorStop(0, 'rgba(200, 220, 240, 0.035)');
    haze.addColorStop(1, 'transparent');
    ctx.fillStyle = haze; ctx.fillRect(0, 110, 400, 60);
    ctx.restore();

  } else if (backgroundStyle === 'studio') {
    ctx.save();
    // Window light beams
    ctx.globalAlpha = 0.03;
    ctx.fillStyle = '#fff';

    // Left window
    ctx.beginPath();
    ctx.moveTo(30, 30); ctx.lineTo(85, 30);
    ctx.lineTo(200, 380); ctx.lineTo(100, 380);
    ctx.closePath();
    ctx.fill();

    // Right window
    ctx.beginPath();
    ctx.moveTo(315, 30); ctx.lineTo(370, 30);
    ctx.lineTo(300, 380); ctx.lineTo(200, 380);
    ctx.closePath();
    ctx.fill();

    // Window frames
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(25, 25, 65, 105);
    ctx.beginPath(); ctx.moveTo(57, 25); ctx.lineTo(57, 130); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(25, 77); ctx.lineTo(90, 77); ctx.stroke();

    ctx.strokeRect(310, 25, 65, 105);
    ctx.beginPath(); ctx.moveTo(342, 25); ctx.lineTo(342, 130); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(310, 77); ctx.lineTo(375, 77); ctx.stroke();

    // Curtain sheers
    ctx.globalAlpha = 0.02;
    ctx.fillRect(27, 27, 61, 101);
    ctx.fillRect(312, 27, 61, 101);

    // Floor line
    ctx.globalAlpha = 0.04;
    ctx.beginPath();
    ctx.moveTo(0, 365); ctx.lineTo(400, 365);
    ctx.stroke();

    // Floor reflections
    ctx.globalAlpha = 0.015;
    [0, 100, 300, 400].forEach(x => {
      ctx.beginPath();
      ctx.moveTo(x, 400); ctx.lineTo(200, 365);
      ctx.stroke();
    });
    ctx.restore();
  }
}

function drawAesthetic() {
  if (aestheticStyle === 'timeless') {
    const g = ctx.createRadialGradient(200, 160, 30, 200, 180, 240);
    g.addColorStop(0, 'rgba(245, 180, 80, 0.06)');
    g.addColorStop(0.5, 'rgba(245, 158, 11, 0.03)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 400, 400);
  } else if (aestheticStyle === 'indie') {
    // Film grain
    ctx.save();
    ctx.globalAlpha = 0.03;
    for (let i = 0; i < 100; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
      ctx.fillRect(Math.random()*400, Math.random()*400, 0.5+Math.random()*1.5, 0.5+Math.random()*1.5);
    }
    ctx.restore();
    // Warm vignette
    const v = ctx.createRadialGradient(200, 200, 60, 200, 200, 260);
    v.addColorStop(0, 'transparent');
    v.addColorStop(1, 'rgba(100, 50, 10, 0.06)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, 400, 400);
  } else if (aestheticStyle === 'ethereal') {
    // Multi-color dreamy washes
    const washes = [
      { x:130, y:110, r:140, c:'rgba(168, 85, 247, 0.05)' },
      { x:280, y:200, r:120, c:'rgba(236, 72, 153, 0.04)' },
      { x:170, y:300, r:130, c:'rgba(6, 182, 212, 0.035)' },
    ];
    washes.forEach(w => {
      const g = ctx.createRadialGradient(w.x, w.y, 10, w.x, w.y, w.r);
      g.addColorStop(0, w.c);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 400, 400);
    });
  }
}

function drawLighting() {
  if (lightingStyle === 'golden') {
    const g = ctx.createLinearGradient(0, 0, 400, 400);
    g.addColorStop(0, 'rgba(245, 180, 60, 0.08)');
    g.addColorStop(0.4, 'rgba(245, 158, 11, 0.03)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 400, 400);
  } else if (lightingStyle === 'dramatic') {
    const g = ctx.createLinearGradient(380, 0, 20, 400);
    g.addColorStop(0, 'rgba(255, 255, 255, 0.07)');
    g.addColorStop(0.25, 'transparent');
    g.addColorStop(0.6, 'rgba(0, 0, 0, 0.08)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0.14)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 400, 400);
  } else if (lightingStyle === 'soft') {
    const g = ctx.createRadialGradient(200, 80, 30, 200, 200, 220);
    g.addColorStop(0, 'rgba(255, 255, 255, 0.07)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 400, 400);
  }
}

// ─── Particles ──────────────────────────────────────────────────────────────

function updateAndDrawParticles() {
  const pHue = figHue;

  // Ambient particles
  ctx.save();
  particles.forEach(pt => {
    pt.x += pt.vx + Math.sin(breath * 0.4 + pt.phase) * pt.drift * 0.15;
    pt.y += pt.vy + Math.cos(breath * 0.25 + pt.phase) * 0.08;

    // Gentle pull toward figure center
    pt.vx += (200 - pt.x) * 0.00003;
    pt.vy += (190 - pt.y) * 0.00003;

    // Wrap
    if (pt.y < -10) { pt.y = 410; pt.x = 60 + Math.random() * 280; }
    if (pt.y > 410) { pt.y = -10; pt.x = 60 + Math.random() * 280; }
    if (pt.x < -10) pt.x = 410;
    if (pt.x > 410) pt.x = -10;

    const flicker = 0.5 + 0.5 * Math.sin(breath * 0.8 + pt.phase);
    ctx.globalAlpha = pt.alpha * flicker;
    ctx.fillStyle = `hsla(${pHue + (pt.phase * 20) % 40 - 20}, 40%, 75%, 1)`;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();

  // Burst particles (from selections)
  ctx.save();
  burstParticles = burstParticles.filter(bp => {
    bp.life -= 0.015;
    if (bp.life <= 0) return false;
    bp.x += bp.vx;
    bp.y += bp.vy;
    bp.vy += 0.02; // gravity
    bp.vx *= 0.99;

    ctx.globalAlpha = bp.life * 0.6;
    ctx.fillStyle = bp.color;
    ctx.beginPath();
    ctx.arc(bp.x, bp.y, bp.size * bp.life, 0, Math.PI * 2);
    ctx.fill();
    return true;
  });
  ctx.restore();
}

function spawnBurst(color) {
  for (let i = 0; i < 20; i++) {
    const angle = (i / 20) * Math.PI * 2 + Math.random() * 0.3;
    const speed = 1 + Math.random() * 3;
    burstParticles.push({
      x: 200,
      y: 180,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      size: 1 + Math.random() * 3,
      life: 0.7 + Math.random() * 0.3,
      color: color,
    });
  }
}

// ─── Main Draw Loop ─────────────────────────────────────────────────────────

function drawFrame() {
  ctx.clearRect(0, 0, 400, 400);
  breath += 0.018;

  // Smoothly interpolate colors
  figHue += (tgtHue - figHue) * 0.02;
  figSat += (tgtSat - figSat) * 0.02;
  figLight += (tgtLight - figLight) * 0.02;
  figAlpha += (tgtAlpha - figAlpha) * 0.02;
  glowHue += (tgtGlowHue - glowHue) * 0.02;
  glowSat += (tgtGlowSat - glowSat) * 0.02;
  glowAlpha += (tgtGlowAlpha - glowAlpha) * 0.02;

  // Pose interpolation
  if (morphProgress < 1) {
    morphProgress = Math.min(1, morphProgress + 0.022);
    currentPose = lerpPose(currentPose, targetPose, easeInOut(morphProgress));
  }

  // Apply breathing
  const bOff = Math.sin(breath) * 1.8;
  const p = {};
  for (const key in currentPose) {
    p[key] = { ...currentPose[key] };
  }
  const breathMap = { head:0.3, neck:0.25, sL:0.15, sR:0.15, eL:0.08, eR:0.08, wL:0.04, wR:0.04 };
  Object.keys(breathMap).forEach(k => { if (p[k]) p[k].y += bOff * breathMap[k]; });

  // ─── Draw layers ───
  drawEnvironment();
  drawAesthetic();
  drawLighting();

  // ─── Ground shadow (positioned below heels) ───
  ctx.save();
  const heelBottomY = Math.max(p.fL.y, p.fR.y) + 18;
  const shadowGrad = ctx.createRadialGradient(p.torso.x, heelBottomY, 5, p.torso.x, heelBottomY, 55);
  shadowGrad.addColorStop(0, `hsla(${figHue}, ${figSat}%, 50%, 0.1)`);
  shadowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = shadowGrad;
  ctx.beginPath();
  ctx.ellipse(p.torso.x, heelBottomY, 55, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ─── Figure ───
  // Build gradient
  const bodyGrad = ctx.createLinearGradient(200, p.head.y - 20, 200, 340);
  bodyGrad.addColorStop(0, `hsla(${figHue}, ${figSat}%, ${figLight + 5}%, ${figAlpha + 0.08})`);
  bodyGrad.addColorStop(0.4, `hsla(${figHue}, ${figSat + 5}%, ${figLight}%, ${figAlpha})`);
  bodyGrad.addColorStop(1, `hsla(${figHue}, ${figSat}%, ${figLight - 8}%, ${figAlpha - 0.05})`);

  // Set glow
  const glowPulse = 0.85 + Math.sin(breath * 0.6) * 0.15;
  ctx.shadowBlur = 22;
  ctx.shadowColor = `hsla(${glowHue}, ${glowSat}%, 60%, ${glowAlpha * glowPulse})`;
  ctx.fillStyle = bodyGrad;

  // Draw body parts as filled shapes (back to front)
  // Lower legs only (upper legs hidden by dress)
  drawFilledLimb(p.kL, p.fL, 10, 6);
  drawFilledLimb(p.kR, p.fR, 10, 6);

  // Stiletto heels
  drawHeel(p.fL, -1);
  drawHeel(p.fR, 1);

  // Torso
  drawTorso(p);

  // Dress skirt (covers upper legs with flowing flared hem)
  drawDressSkirt(p);

  // Neckline detail
  drawNeckline(p);

  // Arms
  drawFilledLimb(p.sL, p.eL, 10, 7);
  drawFilledLimb(p.eL, p.wL, 7, 4.5);
  drawFilledLimb(p.sR, p.eR, 10, 7);
  drawFilledLimb(p.eR, p.wR, 7, 4.5);

  // Hands (simple small shapes)
  ctx.beginPath();
  ctx.ellipse(p.wL.x, p.wL.y + 2, 3.5, 4, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(p.wR.x, p.wR.y + 2, 3.5, 4, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.ellipse(p.head.x, p.head.y, 13, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  // Glasses (cat-eye sunglasses)
  drawGlasses(p);

  // Hair (uses same fillStyle + stroke)
  ctx.shadowBlur = 12;
  drawHair(p);

  // Scarf (flowing from neck, on top of everything)
  drawScarf(p);

  // Turn off shadow for particles
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';

  // ─── Subtle figure edge highlight ───
  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.strokeStyle = `hsla(${figHue}, ${figSat + 20}%, 90%, 1)`;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.ellipse(p.head.x, p.head.y, 13.5, 16.5, 0, -Math.PI * 0.7, Math.PI * 0.1);
  ctx.stroke();
  ctx.restore();

  // ─── Particles (drawn on top) ───
  updateAndDrawParticles();

  requestAnimationFrame(drawFrame);
}
drawFrame();

// ─── Color Updates ──────────────────────────────────────────────────────────

function updateColors() {
  const count = Object.keys(selections).length;

  // Base alpha increases with selections
  tgtAlpha = 0.3 + count * 0.1;

  // Aesthetic drives main color
  if (aestheticStyle === 'timeless') {
    tgtHue = 40; tgtSat = 35; tgtLight = 78;
  } else if (aestheticStyle === 'indie') {
    tgtHue = 30; tgtSat = 30; tgtLight = 72;
  } else if (aestheticStyle === 'ethereal') {
    tgtHue = 270; tgtSat = 40; tgtLight = 80;
  } else {
    tgtHue = 225; tgtSat = 15; tgtLight = 78;
  }

  // Lighting drives glow
  if (lightingStyle === 'golden') {
    tgtGlowHue = 40; tgtGlowSat = 60; tgtGlowAlpha = 0.35;
  } else if (lightingStyle === 'dramatic') {
    tgtGlowHue = 0; tgtGlowSat = 0; tgtGlowAlpha = 0.4;
    // Also tint figure slightly cooler for contrast
    if (!aestheticStyle) { tgtHue = 220; tgtSat = 10; }
  } else if (lightingStyle === 'soft') {
    tgtGlowHue = 210; tgtGlowSat = 25; tgtGlowAlpha = 0.3;
  } else {
    tgtGlowHue = 225; tgtGlowSat = 30; tgtGlowAlpha = 0.2 + count * 0.04;
  }
}

// ─── UI ─────────────────────────────────────────────────────────────────────

function render() {
  const catContainer = document.getElementById('categories');
  catContainer.innerHTML = '';

  CATEGORIES.forEach((cat, catIdx) => {
    const group = document.createElement('div');
    group.className = 'category-group';
    group.style.animationDelay = `${0.22 + catIdx * 0.1}s`;

    const selected = selections[cat.key];
    const dotColor = selected ? cat.color : 'rgba(255,255,255,0.12)';
    const nameColor = selected ? cat.color : 'rgba(255,255,255,0.3)';

    group.innerHTML = `
      <div class="category-header">
        <div class="category-dot ${selected ? 'active' : ''}" style="background:${dotColor}; --cat-color:${cat.color}"></div>
        <span class="category-name" style="color:${nameColor}">${cat.label}</span>
      </div>
      <div class="option-row">
        ${cat.options.map(opt => {
          const isSel = selected?.id === opt.id;
          const bg = isSel ? `${cat.color}15` : 'rgba(255,255,255,0.025)';
          const border = isSel ? `${cat.color}40` : 'rgba(255,255,255,0.06)';
          const color = isSel ? cat.color : 'rgba(255,255,255,0.5)';
          const shadow = isSel ? `${cat.color}20` : 'transparent';
          const glow = `${cat.color}10`;
          return `<button class="option-btn ${isSel?'selected':''}"
            style="background:${bg};border-color:${border};color:${color};--btn-glow:${glow};--btn-shadow:${shadow}"
            onclick="selectOption('${cat.key}','${opt.id}')">${opt.label}</button>`;
        }).join('')}
      </div>
    `;
    catContainer.appendChild(group);
  });

  // Progress
  const progressRow = document.getElementById('progressRow');
  const count = Object.keys(selections).length;
  progressRow.innerHTML = CATEGORIES.map(cat => {
    const filled = !!selections[cat.key];
    return `<div class="progress-bar ${filled?'filled':''}" style="background:${filled?cat.color:'rgba(255,255,255,0.06)'}; --bar-color:${cat.color}"></div>`;
  }).join('') + `<span class="progress-count">${count} / ${CATEGORIES.length}</span>`;

  // Info
  const info = document.getElementById('infoText');
  if (count === 0) info.textContent = 'Each category adds a layer to the final prompt.';
  else if (count < CATEGORIES.length) info.textContent = `${CATEGORIES.length - count} more to explore — or dive in now.`;
  else info.textContent = 'The full tool has 33 categories across pose, styling, camera, and more.';

  // CTA
  const cta = document.getElementById('ctaBtn');
  cta.className = 'cta-btn' + (count > 0 ? ' active' : '');
  cta.querySelector('span').textContent = count > 0 ? 'Open the full studio' : 'Skip to the studio';

  // Prompt preview
  const preview = document.getElementById('promptPreview');
  const promptText = document.getElementById('promptText');
  if (count > 0) {
    preview.classList.add('visible');
    const fullPrompt = Object.values(selections).map(o => o.prompt).join('. ') + '.';
    promptText.textContent = fullPrompt;
  } else {
    preview.classList.remove('visible');
  }

  // Ambient glow
  const glow = document.getElementById('ambientGlow');
  if (count > 0) {
    const keys = Object.keys(selections);
    const lastCat = CATEGORIES.find(c => c.key === keys[keys.length - 1]);
    const col = lastCat?.color || '#8b5cf6';
    glow.style.background = `radial-gradient(ellipse at 50% 50%, ${col}0a 0%, transparent 70%)`;
    glow.style.opacity = '1';
  } else {
    glow.style.opacity = '0';
  }
}

function selectOption(catKey, optId) {
  const cat = CATEGORIES.find(c => c.key === catKey);
  const opt = cat.options.find(o => o.id === optId);
  selections[catKey] = opt;

  if (opt.pose) { targetPose = POSES[opt.pose]; morphProgress = 0; }
  if (catKey === 'lighting') { lightingStyle = opt.lighting || null; }
  if (catKey === 'aesthetic') { aestheticStyle = opt.id; }
  if (catKey === 'background') { backgroundStyle = opt.id; }

  updateColors();
  spawnBurst(cat.color);
  render();
}

function copyPrompt() {
  const text = Object.values(selections).map(o => o.prompt).join('. ') + '.';
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function handleComplete() {
  alert('This is a preview — in the real app, this opens the full studio with 33 categories.');
}

render();
</script>
